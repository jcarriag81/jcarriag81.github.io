  <style>
    .page-section { padding: 4rem 0 6rem; }
    /* ─── EXP LIST ─── */
    .exp-list { display: flex; flex-direction: column; }
    .exp-item {
      display: grid;
      grid-template-columns: 10rem 1fr;
      gap: 2rem;
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--border);
    }
    .exp-item:last-child { border-bottom: none; }
    .exp-period {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.06em;
      white-space: nowrap;
      padding-top: 0.25rem;
    }
    .exp-org { font-size: 0.78rem; color: var(--muted); margin-top: 0.3rem; line-height: 1.4; }
    .exp-role {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--white);
      margin-bottom: 0.6rem;
      line-height: 1.2;
    }
    .exp-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.75; max-width: 52rem; }
    .exp-desc + .exp-desc { margin-top: 0.6rem; }
    .exp-highlights {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .exp-highlight {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 0.2rem 0.65rem;
      font-size: 0.72rem;
      color: var(--muted);
    }
    /* ─── EDU GRID ─── */
    .edu-divider {
      margin: 4rem 0 3rem;
      border: none;
      border-top: 1px solid var(--border);
    }
    .edu-sub-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      color: var(--white);
      margin-bottom: 1.75rem;
    }
    .edu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .edu-item {
      background: var(--bg);
      padding: 1.75rem;
      transition: background 0.2s;
    }
    .edu-item:hover { background: var(--bg-1); }
    .edu-year {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    .edu-title { font-size: 0.95rem; font-weight: 500; color: var(--white); line-height: 1.4; margin-bottom: 0.3rem; }
    .edu-inst { font-size: 0.8rem; color: var(--muted); }
    @media (max-width: 768px) {
      .exp-item { grid-template-columns: 1fr; gap: 0.4rem; }
    }
  </style>

  <script>
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 20));
    const burger = document.getElementById('burger');
    const navLinks = document.getElementById('nav-links');
    burger.addEventListener('click', () => navLinks.classList.toggle('open'));
    navLinks.querySelectorAll('a').forEach(l => l.addEventListener('click', () => navLinks.classList.remove('open')));
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    document.querySelectorAll('.stagger .reveal').forEach((el, i) => { el.style.transitionDelay = i * 70 + 'ms'; });
  </script>
